name: Build & Deploy to Production (k8s)

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  REGISTRY_URL: registry.cloudfares.net
  IMAGE_NAME: galleria/app

jobs:
  # ================================================================
  # Job 1: Build Docker image and push to private registry
  # ================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag_sha: ${{ steps.meta.outputs.tag_sha }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.DOCKER_REGISTRY_USERNAME }}" ]; then
            MISSING="$MISSING DOCKER_REGISTRY_USERNAME"
          fi
          if [ -z "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" ]; then
            MISSING="$MISSING DOCKER_REGISTRY_PASSWORD"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG_SHA="prod-${SHORT_SHA}"
          FULL_IMAGE="${REGISTRY_URL}/${IMAGE_NAME}"

          echo "tag_sha=${TAG_SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # Classic (non-buildx) docker build+push — this Harbor instance's
      # buildx pusher path is unreliable (see squad-sales/tkt-cf migration
      # notes); classic docker push is what this platform's other apps use.
      - name: Build Docker image
        run: |
          docker build -t "${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.tag_sha }}" -f ./Dockerfile .

      - name: Push Docker image
        run: |
          docker push "${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.tag_sha }}"
          docker tag "${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.tag_sha }}" "${{ steps.meta.outputs.full_image }}:prod-latest"
          docker push "${{ steps.meta.outputs.full_image }}:prod-latest"

      - name: Build summary
        run: |
          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.meta.outputs.full_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.meta.outputs.tag_sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # Job 2: Bump the image tag in cloudfares-platform (GitOps — ArgoCD
  # picks up the change and rolls it out to the galleria namespace).
  # DB/mail/APP_KEY creds live in a k8s Secret in that namespace,
  # bootstrapped out-of-band (kubectl) — same convention as this
  # platform's other single-tenant apps.
  # ================================================================
  deploy:
    name: Bump tag in cloudfares-platform
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate platform token
        run: |
          if [ -z "${{ secrets.PLATFORM_REPO_TOKEN }}" ]; then
            echo "::error::Missing required secret: PLATFORM_REPO_TOKEN"
            exit 1
          fi

      - name: Clone cloudfares-platform (prod branch)
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          set -e
          git clone --branch prod \
            https://x-access-token:${GH_TOKEN}@github.com/MohammaedAlani/cloudfares-platform.git platform

      - name: Bump image tag in apps/galleria manifests
        run: |
          set -e
          cd platform
          sed -i "s|registry.cloudfares.net/galleria/app:[a-zA-Z0-9._-]*|registry.cloudfares.net/galleria/app:${{ needs.build-and-push.outputs.image_tag_sha }}|g" \
            apps/galleria/10-app.yaml apps/galleria/40-scheduler.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@cloudfares.net"
          git add apps/galleria/10-app.yaml apps/galleria/40-scheduler.yaml
          git diff --cached --quiet && { echo "No image tag change — skipping commit"; exit 0; }
          git commit -m "galleria prod: bump to ${{ needs.build-and-push.outputs.image_tag_sha }}"

      - name: Push to cloudfares-platform
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          cd platform
          git push origin prod

      - name: Deployment summary
        run: |
          echo "### GitOps Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ needs.build-and-push.outputs.full_image }}:${{ needs.build-and-push.outputs.image_tag_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`galleria\` (via ArgoCD) |" >> $GITHUB_STEP_SUMMARY
